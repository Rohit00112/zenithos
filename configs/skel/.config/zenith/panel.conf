# Zenith OS — Default Panel Configuration
# ~/.config/zenith/panel.conf

[general]
# Panel height in pixels
height = 32

# Panel position: top, bottom
position = "top"

# Panel opacity (0.0 - 1.0)
opacity = 0.92

[left]
# Widgets on the left side
widgets = ["workspace-indicator"]

[center]
# Widgets in the center
widgets = []

[right]
# Widgets on the right side
widgets = ["clock"]

[clock]
# Time format: 12h, 24h
format = "24h"

# Show seconds
show_seconds = false

# Show date in tooltip
show_date_tooltip = true
