# Zenith OS — Default Compositor Configuration
# ~/.config/zenith/compositor.conf

[general]
# Number of virtual workspaces
workspaces = 4

# Default terminal
terminal = "foot"

# Enable server-side decorations
decorations = true

[keybindings]
# Format: modifier+key = action
# Modifiers: super, alt, ctrl, shift

launch_terminal = "super+Return"
close_window = "super+q"
close_window_alt = "alt+F4"
toggle_maximize = "super+f"
exit_compositor = "super+shift+e"

workspace_1 = "super+1"
workspace_2 = "super+2"
workspace_3 = "super+3"
workspace_4 = "super+4"

move_to_workspace_1 = "super+shift+1"
move_to_workspace_2 = "super+shift+2"
move_to_workspace_3 = "super+shift+3"
move_to_workspace_4 = "super+shift+4"

[appearance]
# Border width in pixels
border_width = 2

# Active window border color
border_color_active = "#58a6ff"

# Inactive window border color
border_color_inactive = "#30363d"

# Gap between windows (0 = no gap)
gap = 4

[cursor]
# Cursor theme
theme = "default"

# Cursor size
size = 24
