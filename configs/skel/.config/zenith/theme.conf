# Zenith OS — Default Theme Configuration
# ~/.config/zenith/theme.conf

[theme]
name = "zenith-dark"
variant = "dark"

[colors]
bg_primary = "#0d1117"
bg_secondary = "#161b22"
bg_elevated = "#1c2128"
text_primary = "#e6edf3"
text_secondary = "#8b949e"
accent = "#58a6ff"
accent_hover = "#79c0ff"
success = "#3fb950"
warning = "#d29922"
danger = "#f85149"
border = "#30363d"

[fonts]
ui = "Inter"
mono = "JetBrains Mono"
size = 14

[animation]
# Enable animations
enabled = true

# Animation duration in ms
duration = 200

# Easing function: ease-out, ease-in-out, linear
easing = "ease-out"

# Reduce motion (accessibility)
reduce_motion = false
